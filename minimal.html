<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>NAVER Minimal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="search-area" aria-label="네이버 검색">
      <div class="clock" id="clock">00:00</div>
      
      <div class="meta-row">
        <div class="date" id="date"></div>
        <span class="meta-divider" aria-hidden="true">·</span>
        <a class="weather-badge" id="weatherBadge" href="https://search.naver.com/search.naver?query=%EB%82%A0%EC%94%A8" title="네이버 날씨 바로가기">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          </span>
          <span class="weather-temp" id="weatherTemp">--°</span>
          <span class="weather-desc" id="weatherDesc">날씨</span>
          <span class="weather-city" id="weatherCity"></span>
        </a>
      </div>

      <form class="search-form" id="searchForm" action="https://search.naver.com/search.naver" method="get">
        <label class="sr-only" for="query">네이버 검색어</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path>
        </svg>
        <input id="query" name="query" type="search" placeholder="검색어를 입력하세요"
               autocomplete="off" spellcheck="false" autofocus>
        <button class="clear-button" id="clearButton" type="button" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </form>

      <nav class="services-nav" aria-label="네이버 주요 서비스">
        <a class="service-item" href="https://mail.naver.com" title="메일">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </div>
          <span class="service-name">메일</span>
        </a>

        <a class="service-item" href="https://cafe.naver.com" title="카페">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
              <line x1="6" y1="2" x2="6" y2="4"></line>
              <line x1="10" y1="2" x2="10" y2="4"></line>
              <line x1="14" y1="2" x2="14" y2="4"></line>
            </svg>
          </div>
          <span class="service-name">카페</span>
        </a>

        <a class="service-item" href="https://blog.naver.com" title="블로그">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h10"></path>
              <path d="M6 14h6"></path>
            </svg>
          </div>
          <span class="service-name">블로그</span>
        </a>

        <a class="service-item" href="https://mybox.naver.com" title="MYBOX">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"></path>
              <path d="m8 17 4 4 4-4"></path>
              <path d="M12 12v9"></path>
            </svg>
          </div>
          <span class="service-name">MYBOX</span>
        </a>

        <a class="service-item" href="https://shopping.naver.com" title="쇼핑">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span class="service-name">쇼핑</span>
        </a>

        <a class="service-item" href="https://news.naver.com" title="뉴스">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Z"></path>
              <path d="M18 14h-8"></path>
              <path d="M15 18h-5"></path>
              <path d="M10 6h8v4h-8V6Z"></path>
            </svg>
          </div>
          <span class="service-name">뉴스</span>
        </a>

        <a class="service-item" href="https://map.naver.com" title="지도">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
              <line x1="9" y1="3" x2="9" y2="18"></line>
              <line x1="15" y1="6" x2="15" y2="21"></line>
            </svg>
          </div>
          <span class="service-name">지도</span>
        </a>

        <a class="service-item" href="https://comic.naver.com" title="웹툰">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <circle cx="9" cy="10" r="1.2" fill="currentColor"></circle>
              <circle cx="15" cy="10" r="1.2" fill="currentColor"></circle>
              <path d="M9.5 13.5a3.5 3.5 0 0 0 5 0"></path>
            </svg>
          </div>
          <span class="service-name">웹툰</span>
        </a>
      </nav>

      <div class="hint"><kbd>Enter</kbd><span>검색</span></div>
    </section>
    <footer class="footer">SEARCH SIMPLY.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
